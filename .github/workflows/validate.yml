name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python -m py_compile \
            analysis_core.py \
            run_analysis.py \
            rebuild_composite.py \
            make_notebook.py \
            tests/verify_reproduction.py

      - name: Verify committed outputs
        run: python tests/verify_reproduction.py
